<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Via Carraria" shape-rendering="geometricPrecision">
  <title>Via Carraria</title>
  <defs>
    <style>
      :root {
        --vc-bg: #151d16;
        --vc-border: #28392a;
        --vc-path: #8ce3b0;
        --vc-node: #8ce3b0;
        --vc-accent: #ff8a71;
        --vc-inner-glow: rgba(140, 227, 176, 0.15);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --vc-bg: #f8f6f0;
          --vc-border: #d4cdc0;
          --vc-path: #236a44;
          --vc-node: #236a44;
          --vc-accent: #bd503a;
          --vc-inner-glow: rgba(35, 106, 68, 0.08);
        }
      }
    </style>
  </defs>

  <!-- Base container: squircle stone milestone -->
  <rect width="32" height="32" rx="7.5" fill="var(--vc-bg)" stroke="var(--vc-border)" stroke-width="1" />
  
  <!-- Subtle inner ambient wash -->
  <circle cx="16.5" cy="16" r="10" fill="var(--vc-inner-glow)" />

  <!-- Graph Edges / Monogram Lines -->
  <!-- V path: Root -> Vertex -> Nexus -->
  <path
    d="M 7.5 8.5 L 13.5 23.5 L 19.5 8.5"
    fill="none"
    stroke="var(--vc-path)"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Inter-graph bridge edge: Nexus -> Target Upper -->
  <line
    x1="19.5"
    y1="8.5"
    x2="25.5"
    y2="8.5"
    stroke="var(--vc-path)"
    stroke-width="1.8"
    stroke-linecap="round"
    stroke-dasharray="1 2.5"
    opacity="0.8"
  />

  <!-- C path: Classical orbital arc touching the V right leg at (16.5, 16) -->
  <path
    d="M 25.5 8.5 C 18 8.5 16.5 12 16.5 16 C 16.5 20 18 23.5 25.5 23.5"
    fill="none"
    stroke="var(--vc-path)"
    stroke-width="2.2"
    stroke-linecap="round"
  />

  <!-- Topological Nodes (Knowledge Graph Vertices) -->
  <!-- V Left Root Node -->
  <circle cx="7.5" cy="8.5" r="2" fill="var(--vc-node)" />

  <!-- V Bottom Pivot Node -->
  <circle cx="13.5" cy="23.5" r="2.1" fill="var(--vc-node)" />

  <!-- V-C Convergence Nexus Node (Spatial GraphRAG Highlight) -->
  <circle cx="19.5" cy="8.5" r="2.3" fill="var(--vc-accent)" />

  <!-- Central Topological Intersection Dot -->
  <circle cx="16.5" cy="16" r="1.3" fill="var(--vc-node)" opacity="0.9" />

  <!-- C Upper Terminal Node -->
  <circle cx="25.5" cy="8.5" r="1.9" fill="var(--vc-node)" />

  <!-- C Lower Terminal Node -->
  <circle cx="25.5" cy="23.5" r="2" fill="var(--vc-node)" />
</svg>
